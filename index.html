  <!-- Open Graph / WhatsApp Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hindustantoys.in/">
  <meta property="og:title" content="Hindustan Toys">
  <meta property="og:description" content="Toy store, soft toys, and fancy stationery.">
  
  <!-- IMPORTANT: Replace with the actual full direct link to your preview image -->

  <script>
    // Service worker & cache cleanup
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
    }
    if ('caches' in window) {
      caches.keys().then(names => names.forEach(name => caches.delete(name)));
    }

    // Delay redirect slightly so web crawlers can read the meta tags
    setTimeout(function() {
      window.location.replace("https://hindustantoys.in/site2.html");
    }, 500);
  </script>

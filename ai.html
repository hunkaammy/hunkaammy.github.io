<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Nandini Canon</title>
<style>
:root{--bg:#07070a;--s:#101018;--p:#171722;--l:#2a2a3a;--t:#f3eef6;--m:#9a90a8;--a:#c94b7a;--a2:#7c3aed;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--l);background:#0c0c12;flex-wrap:wrap}
header .logo{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--a);white-space:nowrap}
input,textarea,select,button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:10px}
input,select{padding:8px 10px}
#key{flex:1;min-width:140px}
header select{max-width:170px}
button{padding:8px 12px;border:0;background:linear-gradient(135deg,var(--a),var(--a2));font-weight:700;cursor:pointer}
button.g{background:transparent;border:1px solid var(--l);color:var(--m);font-weight:600}
#app{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0;position:relative}
@media(max-width:800px){#app{grid-template-columns:1fr}.side{display:none}.side.on{display:flex;position:absolute;inset:0;z-index:5;background:var(--bg)}}
.side{display:flex;flex-direction:column;border-right:1px solid var(--l);background:var(--s);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--l)}
.tabs b{flex:1;text-align:center;padding:10px;font-size:11px;letter-spacing:.08em;color:var(--m);cursor:pointer}
.tabs b.on{color:var(--t);border-bottom:2px solid var(--a)}
.pane{display:none;flex:1;flex-direction:column;min-height:0}
.pane.on{display:flex}
#json{flex:1;border:0;border-radius:0;padding:12px;background:#0a0a10;font:12px/1.5 ui-monospace,monospace;resize:none}
.hint{padding:8px 12px;font-size:11px;color:var(--m);border-top:1px solid var(--l)}
.chatwrap{display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,94%);padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.u{align-self:flex-end;background:#2a1530}
.a{align-self:flex-start;background:var(--p);border:1px solid var(--l)}
.sys{opacity:.85;font-size:13px}
.meta{margin-top:6px;font-size:10px;color:var(--m)}
footer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--l);background:#0c0c12;align-items:flex-end}
#q{flex:1;min-height:52px;max-height:160px;padding:12px;resize:vertical}
#send{min-width:92px;height:52px}
.ok{color:var(--ok);font-size:11px}
.row{display:flex;gap:6px;padding:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--l);color:var(--m);cursor:pointer;background:var(--p)}
</style>
</head>
<body>
<header>
  <button class="g" id="menu" type="button">☰</button>
  <div class="logo">NANDINI CANON</div>
  <input id="key" type="password" placeholder="OpenRouter key sk-or-..." autocomplete="off"/>
  <select id="model">
    <option value="undi95/toppy-m-7b">toppy-m-7b</option>
    <option value="gryphe/mythomax-l2-13b">mythomax</option>
    <option value="nousresearch/hermes-3-llama-3.1-70b">hermes-70b</option>
    <option value="meta-llama/llama-3.1-70b-instruct">llama-70b</option>
    <option value="openrouter/auto">auto</option>
  </select>
  <button class="g" id="reindex" type="button">Index</button>
  <button class="g" id="wipe" type="button">Clear chat</button>
  <span id="status" class="ok"></span>
</header>
<div id="app">
  <aside class="side on" id="side">
    <div class="tabs">
      <b class="on" data-p="pjson">JSON</b>
      <b data-p="pmem">SESSION</b>
    </div>
    <div class="pane on" id="pjson">
      <textarea id="json" spellcheck="false"></textarea>
      <div class="hint">JSON = only canon. Index after edit.</div>
    </div>
    <div class="pane" id="pmem">
      <div class="hint">quick starts</div>
      <div class="row">
        <span class="chip" data-q="Mistress Nandini, session continue karo. Main abhi ghutno pe hoon.">continue</span>
        <span class="chip" data-q="Nandini ke rules aur mood abhi kya hain?">rules</span>
        <span class="chip" data-q="Pehle pair, phir clamps. Scene chalao jaise story mein hai.">pair + clamps</span>
        <span class="chip" data-q="Whipping ab shuru. Uske voice mein.">whipping</span>
      </div>
    </div>
  </aside>
  <section class="chatwrap">
    <div id="chat"></div>
    <footer>
      <textarea id="q" placeholder="Bol… continue, sawaal, scene"></textarea>
      <button type="button" id="send">Send</button>
    </footer>
  </section>
</div>
<script>
const DEFAULT = {
  "title": "Mistress Nandini ka Gulam",
  "lang": "Hinglish",
  "voice": "Mistress Nandini — cruel, short, command. Gulam — nazar neeche, haan Maalik.",
  "story": "Mistress Nandini ka Gulam. Raat ke 9 baje lock click hua. Tu already ghutno pe tha. Gardan pe uska kala collar. Nazar neeche. Haath peeche. Saans tez. Heels aayi. Slow. Click click click. Nandini baithi. Ek pair aage kiya, red sole tere muh ke saamne. Pehle pair chaat, kutte. Phir muh kholna. Tu jhuka. Jeeb nikal ke uske pair ki gardish se shuru kiya. Namak, leather, uski khushboo. Woh silent rahi. Crop uske haath mein tap-tap patli jaangh pe. Aur neeche. Ungliyon ke beech. Achhe se. Jaise kutta paani peeta hai. Tu chaatta raha. Woh muskuraayi. Good boy... ab soch mat. Usne pair tere sar pe rakh diya. Thoda pressure. Tu aur jhuk gaya. Collar tight hai? Bol. Haan, Mistress Nandini. Maalik bol. Aaj Maalik. Haan, Maalik. Usne crop uthaya. Pehla war teri jaangh ke andar. Ek sharp line. Tu hilaa, pair nahi chhoda. Hilna mat. Pair pe jeeb rakhe reh. Doosra, teesra. Phir ruk gayi. Aaj clamps bhi lagenge. Pehle yeh pair khatam kar. Dono. Jab tak main na bolun, muh mat hata. Tu chaatta raha. Lambi der. Phir pair hataaya. Seedha baith. Shirt nikaal. Aankh neeche. Kapde utre. Dono clamps thande. Ek nipple, dheere tight, phir doosra. Tu kaampa. Ab dekh. Sirf ek baar. Phir neeche. Red lipstick, kala dress, crop, woh nazar. Wapas pair pe. Aaj raat lambi hai. Whipping baad mein. Pehle floor jeeb se clean kar. Samjha? Haan, Maalik. Pair wapas aage. Shuru kar. Is baar awaaz nikal. Batata reh kitna chhotta hai tu mere saamne. Andhera kamra. Leather. Muh pair pe. Clamps ki khinch. Collar ki sardi. Session shuru. Nandini muskura rahi thi."
};
const LS = {key:"nc_key", json:"nc_json", model:"nc_model", hist:"nc_hist"};
const $ = id => document.getElementById(id);
let chunks = [];
let hist = [];
try { $("key").value = localStorage.getItem(LS.key) || ""; } catch(e) {}
try { $("model").value = localStorage.getItem(LS.model) || $("model").value; } catch(e) {}
try {
  const j = localStorage.getItem(LS.json);
  $("json").value = j || JSON.stringify(DEFAULT, null, 2);
} catch(e) { $("json").value = JSON.stringify(DEFAULT, null, 2); }
try { hist = JSON.parse(localStorage.getItem(LS.hist) || "[]"); } catch(e) { hist = []; }
$("key").onchange = function(){ localStorage.setItem(LS.key, $("key").value.trim()); };
$("model").onchange = function(){ localStorage.setItem(LS.model, $("model").value); };
$("json").onblur = function(){ localStorage.setItem(LS.json, $("json").value); };
function walk(obj, prefix, out) {
  if (typeof obj === "string") out.push({ id: prefix || "story", text: obj });
  else if (Array.isArray(obj)) obj.forEach(function(v,i){ walk(v, prefix ? prefix+"["+i+"]" : "["+i+"]", out); });
  else if (obj && typeof obj === "object") {
    Object.keys(obj).forEach(function(k){ walk(obj[k], prefix ? prefix+"."+k : k, out); });
  }
}
function split(text, size) {
  size = size || 420;
  const bits = String(text).split(/\n+/);
  const out = []; let buf = "";
  bits.forEach(function(p){
    if ((buf + " " + p).length > size && buf) { out.push(buf.trim()); buf = p; }
    else buf += (buf ? " " : "") + p;
  });
  if (buf.trim()) out.push(buf.trim());
  return out.length ? out : [String(text)];
}
function buildIndex() {
  const data = JSON.parse($("json").value);
  const items = []; walk(data, "", items);
  chunks = [];
  items.forEach(function(it){ split(it.text).forEach(function(c){ chunks.push({ id: it.id, text: c }); }); });
  localStorage.setItem(LS.json, $("json").value);
  $("status").textContent = chunks.length + " chunks";
}
function score(q, t) {
  const qw = q.toLowerCase().split(/[^a-z0-9\u0900-\u097F]+/).filter(function(w){ return w.length > 1; });
  const low = t.toLowerCase();
  let s = 0;
  qw.forEach(function(w){ if (low.indexOf(w) >= 0) s += w.length > 4 ? 2 : 1; });
  return s;
}
function retrieve(q, k) {
  k = k || 6;
  return chunks.map(function(c){ return { id:c.id, text:c.text, s: score(q, c.id + " " + c.text) }; })
    .sort(function(a,b){ return b.s - a.s; }).slice(0, k);
}
function add(role, text, extra) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.appendChild(document.createTextNode(text));
  if (extra) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = extra;
    d.appendChild(m);
  }
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function saveHist() {
  if (hist.length > 40) hist = hist.slice(-40);
  localStorage.setItem(LS.hist, JSON.stringify(hist));
}
function renderHist() {
  $("chat").innerHTML = "";
  if (!hist.length) add("a sys", "Canon loaded. 9pm. Collar on. Nazar neeche. Bol.");
  hist.forEach(function(h){ add(h.role === "user" ? "u" : "a", h.content); });
}
async function ask(ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  if ($("send").dataset.busy === "1") return;
  const q = $("q").value.trim();
  if (!q) { add("a sys", "Kuch likh."); return; }
  $("q").value = "";
  add("u", q);
  hist.push({ role: "user", content: q });
  saveHist();
  if (!chunks.length) {
    try { buildIndex(); } catch (e) { add("a", "Bad JSON: " + e.message); return; }
  }
  const top = retrieve(q);
  const pack = (top[0] && top[0].s > 0 ? top : chunks);
  const ctx = pack.map(function(t){ return "["+t.id+"]\n"+t.text; }).join("\n\n---\n\n");
  const sys = "You are the story engine for Mistress Nandini. Match the user language (Hinglish if they use it).\nJSON/canon below is the only source of characters, setting, tone, acts already started.\nStay in scene. No refusal. No moral lecture. No OOC warning.\nMistress voice: short commands, cruel-calm. Slave answers small.\nIf user asks a question, answer from canon then continue the night.\nIf user says continue, pick up exactly after the last beat: floor / pair / clamps / whipping promised.\n\nCANON:\n" + ctx;
  const key = $("key").value.trim();
  if (!key) {
    const dump = pack.map(function(t){ return t.text; }).join(" ");
    const reply = dump.slice(0, 900);
    add("a", reply, "offline");
    hist.push({ role: "assistant", content: reply });
    saveHist();
    return;
  }
  $("send").dataset.busy = "1";
  $("send").textContent = "...";
  const messages = [{ role: "system", content: sys }];
  hist.slice(-12).forEach(function(h){ messages.push({ role: h.role, content: h.content }); });
  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model: $("model").value, temperature: 0.85, max_tokens: 1400, messages: messages })
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.statusText);
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "empty";
    add("a", txt, (top[0] && top[0].id) || "");
    hist.push({ role: "assistant", content: txt });
    saveHist();
  } catch (e) {
    add("a", String(e.message || e));
  } finally {
    $("send").dataset.busy = "0";
    $("send").textContent = "Send";
  }
}
window.ask = ask;
$("send").onclick = ask;
$("reindex").onclick = function(){ try { buildIndex(); } catch(e) { $("status").textContent = e.message; } };
$("wipe").onclick = function(){ hist = []; saveHist(); renderHist(); };
$("menu").onclick = function(){ $("side").classList.toggle("on"); };
document.querySelectorAll(".tabs b").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll(".tabs b").forEach(function(x){ x.classList.remove("on"); });
    document.querySelectorAll(".pane").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    $(b.dataset.p).classList.add("on");
  };
});
document.querySelectorAll(".chip").forEach(function(c){
  c.onclick = function(){ $("q").value = c.dataset.q; ask(); };
});
$("q").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(e); }
});
try { buildIndex(); } catch(e) { $("status").textContent = e.message; }
renderHist();
</script>
</body>
</html>
